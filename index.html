<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - API Client</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes Dashboard</h1>
      <p class="subtitle">Client Prototype for JSONPlaceholder API</p>
    </header>

    <main>
      <!-- Create Note Section -->
      <section class="card form-section">
        <h2>Create a Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="title-input">Title <span class="required">*</span></label>
            <input 
              type="text" 
              id="title-input" 
              placeholder="Enter note title (max 100 characters)" 
              maxlength="100" 
              required
            >
            <small class="field-hint">Max 100 characters</small>
          </div>

          <div class="form-group">
            <label for="body-input">Body</label>
            <textarea 
              id="body-input" 
              rows="4" 
              placeholder="Write your note content here (optional)"
            ></textarea>
          </div>

          <button type="submit" id="submit-btn">Create Note</button>
        </form>
      </section>

      <!-- Action & Status Controls -->
      <section class="card controls-section">
        <div class="actions-bar">
          <button type="button" id="load-btn">Load Notes</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <!-- Notes List -->
      <section class="card notes-section">
        <h2>Notes Collection</h2>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </div>
</body>
</html>
